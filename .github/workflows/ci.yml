name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-test-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1" --health-interval 10s --health-retries 12
    defaults: { run: { working-directory: backend } }
    env:
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_TEST_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q   # includes Neo4j store parity (tests/test_neo4j.py)

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "**/requirements.txt" }
      - run: pip install -r data/requirements.txt -r backend/requirements.txt
      - run: cd data && pytest -q
      - name: validate processed data (schema + integrity)
        run: python scripts/validate_data.py
      - name: sample dataset and fixtures are reproducible
        run: python scripts/seed_demo.py && git diff --exit-code contracts/

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env: { PYTHON: python }

  # Production web deploy after every green push to main. The Vercel project
  # (Root Directory = web) holds VITE_API_BASE; only VERCEL_TOKEN is a secret.
  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, data, web]
    runs-on: ubuntu-latest
    concurrency: { group: deploy-web, cancel-in-progress: false }
    env:
      VERCEL_ORG_ID: team_3mYGh4Bed0zLOeCAkgd676gZ
      VERCEL_PROJECT_ID: prj_upqe3U22qm208Dl1MtvBjB8AUKvD
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}   # read by the CLI; never on the command line
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production
      - run: vercel build --prod
      - run: vercel deploy --prebuilt --prod
